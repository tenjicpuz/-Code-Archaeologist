[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "code-archaeologist"
version = "0.1.0"
description = "Evidence-grounded codebase exploration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.29,<1.0", "pydantic>=2.6,<3.0", "typer>=0.12,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
code-archaeologist = "code_archaeologist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_archaeologist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
